name: Release

# Publishing a GitHub release (drafted in the GitHub UI, which creates its tag vX.Y.Z or X.Y.Z) publishes the
# version X.Y.Z (it is not compared with pom.xml) once the whole CI passes on the tagged commit:
# - the runnable jar, the archives (jar, launcher, AGENTS.md, docs, examples), the native binaries that need
#   no Java (alang-PLATFORM archives, built and tested by the ci job), AGENTS.md on its own and SHA256SUMS,
#   attached to that release, whose notes gain a table of these files;
# - the Maven artifacts (io.github.adamw7:alang: the jar, its pom and the archives) in GitHub Packages.
# The workflow creates no tag and no release: both exist before it starts. Run by hand from the Actions tab
# with a release's tag, it publishes that release again: for one whose tag predates this workflow, or one
# whose run failed. A version already in GitHub Packages stays as it is (it can be published only once).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the published release to attach the files to, such as 0.5.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Fails here, before CI, when no published release has this tag.
          gh release view "$TAG" --json tagName --jq .tagName > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes a `github` server to settings.xml (the id in pom.xml's distributionManagement) that
          # signs in with GITHUB_TOKEN.
          server-id: github

      - name: Publish to GitHub Packages
        # Builds the jar and the archives from the tagged commit; the ci job has run every test on it.
        # GitHub Packages refuses a version it already has (409 Conflict), so a re-run only builds.
        timeout-minutes: 5
        run: |
          POM_VERSION="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          pom="https://maven.pkg.github.com/$GITHUB_REPOSITORY/io/github/adamw7/alang/$POM_VERSION/alang-$POM_VERSION.pom"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$pom" || true)"
          echo "GitHub Packages answers $status for alang-$POM_VERSION.pom"
          if [[ "$status" == 2* || "$status" == 3* ]]; then
            echo "::notice::io.github.adamw7:alang:$POM_VERSION is already in GitHub Packages; it is not deployed again."
            mvn -B -ntp -DskipTests package
          else
            mvn -B -ntp -DskipTests deploy
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the native binaries
        # The archives that the ci job's native builds made and tested, from this same run.
        uses: actions/download-artifact@v8
        with:
          pattern: alang-native-*
          path: native
          merge-multiple: true

      - name: Attach the files to the GitHub release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The files are named by the <version> in pom.xml, which need not be the tag's.
          tarball=(target/alang-*.tar.gz)
          FILES="${tarball[0]#target/alang-}"
          FILES="${FILES%.tar.gz}"
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          cp target/alang.jar "$assets/alang-$FILES.jar"
          cp "target/alang-$FILES.tar.gz" "target/alang-$FILES.zip" AGENTS.md "$assets/"
          cp native/alang-*.tar.gz native/alang-*.zip "$assets/"
          (cd "$assets" && sha256sum -- * > SHA256SUMS)

          # The release and its tag already exist; --clobber lets a re-run replace the files.
          gh release upload "$TAG" "$assets"/* --clobber

          cat > "$RUNNER_TEMP/files.md" <<EOF
          Install on Linux or macOS with \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\`, which puts the binary for your platform on your PATH; it needs no Java. Elsewhere, unpack \`alang-$FILES.tar.gz\` (or the \`.zip\`) and run \`alang-$FILES/bin/alang\`, or run the jar directly: \`java -jar alang-$FILES.jar\`; both need Java 21 or newer. Agents start with [AGENTS.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/AGENTS.md).

          | File | Contents |
          |------|----------|
          | \`alang-linux-x64.tar.gz\`, \`alang-linux-arm64.tar.gz\`, \`alang-macos-arm64.tar.gz\`, \`alang-windows-x64.zip\` | \`bin/alang\` (\`bin\\alang.exe\`) as a native binary that needs no Java, with AGENTS.md, the docs and the examples; Linux needs glibc 2.35 or newer |
          | \`alang-$FILES.tar.gz\`, \`alang-$FILES.zip\` | \`bin/alang\`, \`lib/alang.jar\`, AGENTS.md, README.md, the spec, the error catalog and the other docs, the grammar, the examples, \`harness/toon.py\`, the licenses |
          | \`alang-$FILES.jar\` | The toolchain as one runnable jar, with AGENTS.md inside (\`/alang/AGENTS.md\` on the classpath) |
          | \`AGENTS.md\` | The guide for agents writing ALang |
          | \`SHA256SUMS\` | Checksums of the files above |

          The jar is also in GitHub Packages as \`io.github.adamw7:alang:$FILES\`.
          EOF

          # Puts the table above the notes written when the release was drafted, once: a re-run leaves them.
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/drafted.md"
          if ! grep -q '^| File | Contents |' "$RUNNER_TEMP/drafted.md"; then
            { cat "$RUNNER_TEMP/files.md"; echo; cat "$RUNNER_TEMP/drafted.md"; } > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
