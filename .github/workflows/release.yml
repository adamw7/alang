name: Release

# Pushing a tag vX.Y.Z publishes the version X.Y.Z (it is not compared with pom.xml) once the whole CI
# passes on the tagged commit:
# - a GitHub release with the runnable jar, the archives (jar, launcher, AGENTS.md, docs, examples),
#   AGENTS.md on its own and SHA256SUMS;
# - the Maven artifacts (io.github.adamw7:alang: the jar, its pom and the archives) in GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes a `github` server to settings.xml (the id in pom.xml's distributionManagement) that
          # signs in with GITHUB_TOKEN.
          server-id: github

      - name: Publish to GitHub Packages
        # Builds the jar and the archives from the tagged commit; the ci job has run every test on it.
        timeout-minutes: 5
        run: mvn -B -ntp -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The files are named by the <version> in pom.xml, which need not be the tag's.
          tarball=(target/alang-*.tar.gz)
          FILES="${tarball[0]#target/alang-}"
          FILES="${FILES%.tar.gz}"
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          cp target/alang.jar "$assets/alang-$FILES.jar"
          cp "target/alang-$FILES.tar.gz" "target/alang-$FILES.zip" AGENTS.md "$assets/"
          (cd "$assets" && sha256sum -- * > SHA256SUMS)

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Needs Java 21 or newer. Unpack \`alang-$FILES.tar.gz\` (or the \`.zip\`) and run \`alang-$FILES/bin/alang\`, or run the jar directly: \`java -jar alang-$FILES.jar\`. Agents start with [AGENTS.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/AGENTS.md).

          | File | Contents |
          |------|----------|
          | \`alang-$FILES.tar.gz\`, \`alang-$FILES.zip\` | \`bin/alang\`, \`lib/alang.jar\`, AGENTS.md, README.md, the spec, the error catalog and the other docs, the grammar, the examples, \`harness/toon.py\`, the licenses |
          | \`alang-$FILES.jar\` | The toolchain as one runnable jar, with AGENTS.md inside (\`/alang/AGENTS.md\` on the classpath) |
          | \`AGENTS.md\` | The guide for agents writing ALang |
          | \`SHA256SUMS\` | Checksums of the files above |

          The jar is also in GitHub Packages as \`io.github.adamw7:alang:$FILES\`.
          EOF

          gh release create "$GITHUB_REF_NAME" "$assets"/* \
            --verify-tag \
            --title "ALang $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
