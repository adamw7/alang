name: CI

on:
  # Branches only: a v* tag runs this workflow from release.yml, before publishing.
  push:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A run takes about a minute. These limits make a hang fail fast instead of holding a runner.
    # Inside the tests, each test fails after 10 s, and Surefire kills the test JVM if the whole run
    # takes longer than 180 s (see pom.xml).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Require gcc and clang
        # CBackendTest skips (instead of failing) when no C compiler is on PATH.
        run: |
          gcc --version
          clang --version

      - name: Build and test
        timeout-minutes: 5
        run: mvn -B -ntp verify

      - name: CLI smoke test
        # Exercises the packaged jar through bin/alang, which the unit tests do not.
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/alang"
          mkdir -p "$out"

          # Every example type-checks, passes its tests and prints its golden output.
          for f in examples/*.al; do
            n="$(basename "$f" .al)"
            bin/alang check "$f"
            bin/alang test "$f"
            bin/alang run "$f" > "$out/$n.out"
            diff -u "tests/examples/$n.out" "$out/$n.out"
          done

          # Tools: JSON definitions and a JSON call.
          bin/alang tools examples/text_tools.al | python3 -m json.tool > /dev/null
          bin/alang call examples/inventory.al place_order '{"sku": "B-200", "quantity": 2}' > "$out/call.json"
          cat "$out/call.json"
          grep -q '"ok": true' "$out/call.json"
          # `-` reads the arguments from stdin.
          echo '{"sku": "B-200", "quantity": 2}' > "$out/args.json"
          bin/alang call examples/inventory.al place_order - < "$out/args.json" > "$out/call.json"
          grep -q '"ok": true' "$out/call.json"
          # Without an argument, `call` must not read stdin: here stdin stays open and never sends
          # anything, so a call that reads it hangs until the step's time limit.
          printf 'tool fn one() -> i64 {\n    return 1;\n}\n' > "$out/one.al"
          mkfifo "$out/stdin"
          sleep 600 > "$out/stdin" &
          writer=$!
          bin/alang call "$out/one.al" one < "$out/stdin" > "$out/one.json"
          kill "$writer"
          grep -q '"result": 1' "$out/one.json"
          # `serve`: the same tools over MCP; it stops when stdin ends.
          printf '%s\n' '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' | bin/alang serve examples/text_tools.al > "$out/serve.json"
          grep -q '"name": "word_count"' "$out/serve.json"

          # bin/alang rebuilds the jar after a source change, and only then.
          touch src/main/java/alang/cli/Main.java
          bin/alang version 2> "$out/rebuild.err"
          grep -q 'building .* (sources changed)' "$out/rebuild.err"
          bin/alang version 2> "$out/rebuild.err"
          if grep -q 'building' "$out/rebuild.err"; then exit 1; fi

          # C backend: the compiled program prints the same bytes as the interpreter.
          bin/alang build examples/shapes.al -o "$out/shapes.c"
          cc -std=c99 -O2 "$out/shapes.c" -lm -o "$out/shapes"
          "$out/shapes" | diff -u tests/examples/shapes.out -

          # Exit codes: 1 for diagnostics, 2 for usage errors.
          status=0
          bin/alang check tests/errors/E0001_and_and.al --json > "$out/err.json" || status=$?
          test "$status" -eq 1
          grep -q '"code": "E0001"' "$out/err.json"
          status=0
          bin/alang no-such-command || status=$?
          test "$status" -eq 2
          bin/alang explain E0215 > /dev/null

          # Non-ASCII arguments survive the C locale: bin/alang reads them as UTF-8 ("é" is 2 bytes).
          printf 'tool fn size(text: str[16]) -> i64 {\n    return len(text);\n}\n' > "$out/size.al"
          LC_ALL=C bin/alang call "$out/size.al" size '{"text": "é"}' > "$out/size.json"
          grep -q '"result": 2' "$out/size.json"

      - name: Release archives
        # What a release publishes (src/dist/assembly.xml): the jar with a launcher that needs only Java,
        # AGENTS.md, the docs and the examples, as a .tar.gz and a .zip with the same files.
        timeout-minutes: 2
        run: |
          version="$(bin/alang version | cut -d ' ' -f 2)"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out/tar" "$out/zip" "$out/path"
          tar -xzf "target/alang-$version.tar.gz" -C "$out/tar"
          unzip -q "target/alang-$version.zip" -d "$out/zip"
          diff -r "$out/tar" "$out/zip"
          test -x "$out/zip/alang-$version/bin/alang"
          home="$out/tar/alang-$version"
          cmp target/alang.jar "$home/lib/alang.jar"
          for f in AGENTS.md README.md LICENSE THIRD-PARTY-NOTICES docs/*.md grammar/ALang.g4 examples/*.al examples/README.md harness/toon.py; do
            cmp "$f" "$home/$f"
          done

          # The jar alone carries the guide and the licenses (the ANTLR runtime is inside it).
          unzip -p target/alang.jar alang/AGENTS.md | cmp - AGENTS.md
          unzip -p target/alang.jar META-INF/LICENSE | cmp - LICENSE
          unzip -p target/alang.jar META-INF/THIRD-PARTY-NOTICES | cmp - THIRD-PARTY-NOTICES

          # The launcher runs from any directory and through a symlink, such as one on PATH.
          ln -s "$home/bin/alang" "$out/path/alang"
          cd "$out"
          path/alang version | grep -qx "alang $version"
          path/alang run "$home/examples/hello.al" | diff -u "$GITHUB_WORKSPACE/tests/examples/hello.out" -
          path/alang test "$home/examples/shapes.al"
          printf 'tool fn size(text: str[16]) -> i64 {\n    return len(text);\n}\n' > size.al
          LC_ALL=C path/alang call size.al size '{"text": "é"}' | grep -q '"result": 2'

      - name: TOON converter
        # harness/toon.py shows `alang call` results to a model as TOON; standard library only.
        timeout-minutes: 2
        run: |
          python3 harness/test_toon.py
          bin/alang call examples/text_tools.al most_common_letter '{"text": "hello"}' | python3 harness/toon.py > "$RUNNER_TEMP/call.toon"
          printf 'ok: true\nresult:\n  letter: l\n  count: 2\nstdout: ""\nsteps: 84\n' | diff -u - "$RUNNER_TEMP/call.toon"

      - name: Benchmark self-test
        # The benchmark's reference solutions must keep passing as the language changes (no API calls).
        if: runner.os == 'Linux'
        run: python3 bench/bench.py selftest

  fuzz:
    name: Fuzz (3000 mutations per program)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fuzz the checker and interpreter
        timeout-minutes: 5
        run: mvn -B -ntp test -Dtest=FuzzTest -Dalang.fuzz=3000

