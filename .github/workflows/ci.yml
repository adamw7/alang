name: CI

on:
  # Branches only: a published release runs this workflow from release.yml, before publishing.
  push:
    branches: ['**']
  workflow_call:
    inputs:
      ref:
        description: The ref to test, such as refs/tags/0.5.0; empty tests the commit that triggered the run.
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A run takes a few minutes. These limits make a hang fail fast instead of holding a runner.
    # Inside the tests, each test fails after 10 s, and Surefire kills the test JVM if the whole run
    # takes longer than 360 s (see pom.xml).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so every OS runs the same scripts.
        shell: bash
    env:
      # Windows has no python3 command.
      PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Require gcc and clang
        # CBackendTest skips (instead of failing) when no C compiler is on PATH.
        run: |
          gcc --version
          clang --version

      - name: Build and test
        timeout-minutes: 8
        run: mvn -B -ntp verify

      - name: CLI smoke test
        # Exercises the packaged jar through bin/alang, which the unit tests do not.
        timeout-minutes: 3
        run: |
          out="$RUNNER_TEMP/alang"
          mkdir -p "$out"

          # Every example type-checks, passes its tests and prints its golden output; one whose main
          # reads the standard input gets examples/NAME.in, and the others an empty stdin.
          for f in examples/*.al; do
            n="$(basename "$f" .al)"
            input="examples/$n.in"
            [ -f "$input" ] || input=/dev/null
            bin/alang check "$f"
            bin/alang test "$f"
            bin/alang run "$f" < "$input" > "$out/$n.out"
            diff -u "tests/examples/$n.out" "$out/$n.out"
          done

          # Tools: JSON definitions and a JSON call.
          bin/alang tools examples/text_tools.al | "$PYTHON" -m json.tool > /dev/null
          bin/alang call examples/inventory.al place_order '{"sku": "B-200", "quantity": 2}' > "$out/call.json"
          cat "$out/call.json"
          grep -q '"ok": true' "$out/call.json"
          # `-` reads the arguments from stdin.
          echo '{"sku": "B-200", "quantity": 2}' > "$out/args.json"
          bin/alang call examples/inventory.al place_order - < "$out/args.json" > "$out/call.json"
          grep -q '"ok": true' "$out/call.json"
          # Without an argument, `call` must not read stdin: here stdin stays open and never sends
          # anything, so a call that reads it hangs until the step's time limit. Git Bash cannot hand
          # a FIFO to a Windows program; CliTest checks the same on every OS.
          if [ "$RUNNER_OS" != Windows ]; then
            printf 'tool fn one() -> i64 {\n    return 1;\n}\n' > "$out/one.al"
            mkfifo "$out/stdin"
            sleep 600 > "$out/stdin" &
            writer=$!
            bin/alang call "$out/one.al" one < "$out/stdin" > "$out/one.json"
            kill "$writer"
            grep -q '"result": 1' "$out/one.json"
          fi
          # `serve`: the same tools over MCP; it stops when stdin ends.
          printf '%s\n' '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' | bin/alang serve examples/text_tools.al > "$out/serve.json"
          grep -q '"name": "word_count"' "$out/serve.json"
          # `serve --http`: MCP over HTTP with a token, then a clean stop on SIGTERM.
          if [ "$RUNNER_OS" != Windows ]; then
            printf 'smoke-test-token-0123456789\n' > "$out/token"
            bin/alang serve examples/inventory.al --http 127.0.0.1:18765 --token-file "$out/token" 2> "$out/http.log" &
            server=$!
            # On a failure below, show what the server logged, and stop it.
            trap 'echo "--- serve --http log:"; cat "$out/http.log"; kill "$server" 2> /dev/null || true' ERR
            for i in $(seq 100); do curl -fs http://127.0.0.1:18765/health > /dev/null && break; sleep 0.2; done
            auth='Authorization: Bearer smoke-test-token-0123456789'
            curl -fs -D "$out/headers" -H "$auth" -H 'Content-Type: application/json' http://127.0.0.1:18765/mcp \
              -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}}' > /dev/null
            session="$(grep -i '^mcp-session-id:' "$out/headers" | cut -d' ' -f2 | tr -d '\r')"
            curl -fs -H "$auth" -H "Mcp-Session-Id: $session" http://127.0.0.1:18765/mcp \
              -d '{"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "place_order", "arguments": {"sku": "B-200", "quantity": 2}}}' \
              | grep -q '"isError": false'
            curl -fs -H "$auth" http://127.0.0.1:18765/metrics | grep -q 'alang_tool_calls_total{tool="place_order",outcome="ok"} 1'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/mcp -d '{}')" = 401
            kill "$server"
            wait "$server" || true
            grep -q '"event": "stopped"' "$out/http.log"
            trap - ERR
          fi

          # bin/alang rebuilds the jar after a source change, and only then.
          touch src/main/java/alang/cli/Main.java
          bin/alang version 2> "$out/rebuild.err"
          grep -q 'building .* (sources changed)' "$out/rebuild.err"
          bin/alang version 2> "$out/rebuild.err"
          if grep -q 'building' "$out/rebuild.err"; then exit 1; fi

          # C backend: the compiled program prints the same bytes as the interpreter. Windows has gcc
          # but no cc.
          cc=cc
          command -v cc > /dev/null || cc=gcc
          bin/alang build examples/shapes.al -o "$out/shapes.c"
          "$cc" -std=c99 -O2 "$out/shapes.c" -lm -o "$out/shapes"
          "$out/shapes" | diff -u tests/examples/shapes.out -

          # Exit codes: 1 for diagnostics, 2 for usage errors.
          status=0
          bin/alang check tests/errors/E0001_and_and.al --json > "$out/err.json" || status=$?
          test "$status" -eq 1
          grep -q '"code": "E0001"' "$out/err.json"
          status=0
          bin/alang no-such-command || status=$?
          test "$status" -eq 2
          bin/alang explain E0215 > /dev/null

          # Non-ASCII arguments survive the C locale: bin/alang reads them as UTF-8 ("é" is 2 bytes).
          printf 'tool fn size(text: str[16]) -> i64 {\n    return len(text);\n}\n' > "$out/size.al"
          LC_ALL=C bin/alang call "$out/size.al" size '{"text": "é"}' > "$out/size.json"
          grep -q '"result": 2' "$out/size.json"

      - name: Release archives
        # What a release publishes (src/dist/assembly.xml): the jar with a launcher that needs only Java,
        # AGENTS.md, the docs and the examples, as a .tar.gz and a .zip with the same files.
        timeout-minutes: 2
        env:
          # Git Bash on Windows copies the file for `ln -s` unless told to make a real symbolic link.
          MSYS: winsymlinks:nativestrict
        run: |
          version="$(bin/alang version | cut -d ' ' -f 2)"
          tmp="$RUNNER_TEMP"
          # On Windows a POSIX path: GNU tar reads the "D:" of D:\a\_temp as the name of a remote host.
          if [ "$RUNNER_OS" = Windows ]; then tmp="$(cygpath -u "$tmp")"; fi
          out="$tmp/dist"
          mkdir -p "$out/tar" "$out/zip" "$out/jar" "$out/path"
          tar -xzf "target/alang-$version.tar.gz" -C "$out/tar"
          if command -v unzip > /dev/null; then
            unzip -q "target/alang-$version.zip" -d "$out/zip"
          else
            # Git Bash on Windows has no unzip; the JDK's jar tool reads any zip file.
            (cd "$out/zip" && jar -xf "$GITHUB_WORKSPACE/target/alang-$version.zip")
          fi
          diff -r "$out/tar" "$out/zip"
          test -x "$out/zip/alang-$version/bin/alang"
          # The Windows launcher has CRLF line endings on every line, which cmd.exe needs.
          cmd_file="$out/tar/alang-$version/bin/alang.cmd"
          test "$(grep -c $'\r$' "$cmd_file")" -eq "$(wc -l < "$cmd_file")"
          home="$out/tar/alang-$version"
          cmp target/alang.jar "$home/lib/alang.jar"
          for f in AGENTS.md README.md LICENSE THIRD-PARTY-NOTICES docs/*.md grammar/ALang.g4 examples/*.al examples/*.in examples/README.md harness/toon.py; do
            cmp "$f" "$home/$f"
          done

          # The jar alone carries the guide and the licenses (the ANTLR runtime is inside it).
          (cd "$out/jar" && jar -xf "$GITHUB_WORKSPACE/target/alang.jar" alang/AGENTS.md META-INF/LICENSE META-INF/THIRD-PARTY-NOTICES)
          cmp "$out/jar/alang/AGENTS.md" AGENTS.md
          cmp "$out/jar/META-INF/LICENSE" LICENSE
          cmp "$out/jar/META-INF/THIRD-PARTY-NOTICES" THIRD-PARTY-NOTICES

          # The launcher runs from any directory and through a symlink, such as one on PATH.
          ln -s "$home/bin/alang" "$out/path/alang"
          cd "$out"
          path/alang version | grep -qx "alang $version"
          path/alang run "$home/examples/hello.al" | diff -u "$GITHUB_WORKSPACE/tests/examples/hello.out" -
          path/alang test "$home/examples/shapes.al"
          printf 'tool fn size(text: str[16]) -> i64 {\n    return len(text);\n}\n' > size.al
          LC_ALL=C path/alang call size.al size '{"text": "é"}' | grep -q '"result": 2'

      - name: Windows launcher
        # The release archive's bin\alang.cmd, run from PowerShell as a Windows user runs it, in a folder
        # whose path has a space in it.
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $dist = Join-Path $env:RUNNER_TEMP 'with space'
          Copy-Item -Recurse (Get-Item (Join-Path $env:RUNNER_TEMP 'dist\tar\alang-*')).FullName $dist
          $alang = Join-Path $dist 'bin\alang.cmd'
          & $alang version
          $hello = & $alang run (Join-Path $dist 'examples\hello.al')
          if ("$hello" -ne (Get-Content tests/examples/hello.out -Raw).Trim()) { throw "hello.al printed: $hello" }
          & $alang test (Join-Path $dist 'examples\shapes.al')
          # `alang call` arguments on stdin, as the launcher advises; "é" is 2 bytes in UTF-8.
          Set-Content -Path size.al -Value "tool fn size(text: str[16]) -> i64 {`n    return len(text);`n}"
          $result = ('{"text": "' + [char]0xE9 + '"}') | & $alang call size.al size -
          if ("$result" -notmatch '"result": 2') { throw "call printed: $result" }
          # The exit code comes through: 1 for diagnostics.
          $PSNativeCommandUseErrorActionPreference = $false
          & $alang check tests/errors/E0001_and_and.al --json > $null
          if ($LASTEXITCODE -ne 1) { throw "check exited with $LASTEXITCODE, expected 1" }
          $PSNativeCommandUseErrorActionPreference = $true
          & $alang explain E0215 > $null

      - name: TOON converter
        # harness/toon.py shows `alang call` results to a model as TOON; standard library only.
        timeout-minutes: 2
        run: |
          "$PYTHON" harness/test_toon.py
          bin/alang call examples/text_tools.al most_common_letter '{"text": "hello"}' | "$PYTHON" harness/toon.py > "$RUNNER_TEMP/call.toon"
          printf 'ok: true\nresult:\n  letter: l\n  count: 2\nstdout: ""\nsteps: 82\n' | diff -u - "$RUNNER_TEMP/call.toon"

      - name: Benchmark self-test
        # The benchmark's reference solutions must keep passing as the language changes (no API calls).
        if: runner.os == 'Linux'
        run: python3 bench/bench.py selftest

  native:
    name: Native binary (${{ matrix.platform }})
    # The toolchain compiled ahead of time with GraalVM native-image: one file that needs no Java and starts
    # in milliseconds. Each binary runs the same smoke test as the jar, and its archive is kept as an
    # artifact of the run, which release.yml attaches to the release.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu runners: a binary needs a glibc at least as new as the one it was
          # built with, and 2.35 covers Ubuntu 22.04, Debian 12, Fedora 36 and later.
          - {os: ubuntu-22.04, platform: linux-x64}
          - {os: ubuntu-22.04-arm, platform: linux-arm64}
          - {os: macos-latest, platform: macos-arm64}
          - {os: windows-latest, platform: windows-x64, exe: .exe}
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build the jar
        timeout-minutes: 5
        run: mvn -B -ntp -DskipTests package

      - name: Compile it to a native binary
        # The options are in the jar: src/main/resources/META-INF/native-image.
        timeout-minutes: 12
        run: |
          mkdir -p target/native
          # On Windows it is native-image.cmd, which bash finds only by its full name.
          native_image=native-image
          if [ "$RUNNER_OS" = Windows ]; then native_image=native-image.cmd; fi
          "$native_image" -jar target/alang.jar -o target/native/alang

      - name: Smoke test the binary
        timeout-minutes: 3
        run: |
          alang="$GITHUB_WORKSPACE/target/native/alang$EXE"
          out="$RUNNER_TEMP/native"
          mkdir -p "$out"
          version="$(java -jar target/alang.jar version)"
          test "$("$alang" version)" = "$version"

          # The examples print the same bytes as with the jar, and pass their tests.
          for f in examples/*.al; do
            n="$(basename "$f" .al)"
            input="examples/$n.in"
            [ -f "$input" ] || input=/dev/null
            "$alang" check "$f" > /dev/null
            "$alang" test "$f" > /dev/null
            "$alang" run "$f" < "$input" > "$out/$n.out"
            diff -u --strip-trailing-cr "tests/examples/$n.out" "$out/$n.out"
          done
          "$alang" fuzz examples/text_tools.al > /dev/null

          # Tools, MCP, the C backend's source, fixes and the guide: what reads resources or starts threads.
          "$alang" call examples/inventory.al place_order '{"sku": "B-200", "quantity": 2}' | grep -q '"ok": true'
          echo '{"sku": "B-200", "quantity": 2}' | "$alang" call examples/inventory.al place_order - | grep -q '"ok": true'
          printf '%s\n' '{"jsonrpc": "2.0", "id": 1, "method": "tools/list"}' | "$alang" serve examples/text_tools.al | grep -q '"name": "word_count"'
          # `serve --http`: MCP over HTTP with a token, then a clean stop on SIGTERM.
          if [ "$RUNNER_OS" != Windows ]; then
            printf 'smoke-test-token-0123456789\n' > "$out/token"
            "$alang" serve examples/inventory.al --http 127.0.0.1:18765 --token-file "$out/token" 2> "$out/http.log" &
            server=$!
            # On a failure below, show what the server logged, and stop it.
            trap 'echo "--- serve --http log:"; cat "$out/http.log"; kill "$server" 2> /dev/null || true' ERR
            for i in $(seq 100); do curl -fs http://127.0.0.1:18765/health > /dev/null && break; sleep 0.2; done
            auth='Authorization: Bearer smoke-test-token-0123456789'
            curl -fs -D "$out/headers" -H "$auth" -H 'Content-Type: application/json' http://127.0.0.1:18765/mcp \
              -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18"}}' > /dev/null
            session="$(grep -i '^mcp-session-id:' "$out/headers" | cut -d' ' -f2 | tr -d '\r')"
            curl -fs -H "$auth" -H "Mcp-Session-Id: $session" http://127.0.0.1:18765/mcp \
              -d '{"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "place_order", "arguments": {"sku": "B-200", "quantity": 2}}}' \
              | grep -q '"isError": false'
            curl -fs -H "$auth" http://127.0.0.1:18765/metrics | grep -q 'alang_tool_calls_total{tool="place_order",outcome="ok"} 1'
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/mcp -d '{}')" = 401
            kill "$server"
            wait "$server" || true
            grep -q '"event": "stopped"' "$out/http.log"
            trap - ERR
          fi
          "$alang" build examples/shapes.al -o "$out/shapes.c"
          grep -q 'int main' "$out/shapes.c"
          printf 'fn main() {\n    let n = 2;\n    print(n);\n}\n' > "$out/fix.al"
          "$alang" fix "$out/fix.al" | grep -q 'let n: i64 = 2;'
          "$alang" explain E0215 > /dev/null

          # Exit codes: 1 for diagnostics, 2 for usage errors.
          status=0
          "$alang" check tests/errors/E0001_and_and.al --json > "$out/err.json" || status=$?
          test "$status" -eq 1
          grep -q '"code": "E0001"' "$out/err.json"
          status=0
          "$alang" no-such-command 2> /dev/null || status=$?
          test "$status" -eq 2

          # Non-ASCII arguments in the C locale, which bin/alang handles for the jar by setting a UTF-8 one.
          if [ "$RUNNER_OS" != Windows ]; then
            printf 'tool fn size(text: str[16]) -> i64 {\n    return len(text);\n}\n' > "$out/size.al"
            LC_ALL=C "$alang" call "$out/size.al" size '{"text": "é"}' | grep -q '"result": 2'
          fi

          # Startup: the reason for the binary.
          time "$alang" check examples/sudoku.al > /dev/null

      - name: Archive
        # alang-PLATFORM/: bin/alang, the guide, the docs and the examples, as in the jar's archive. The name
        # has no version, so https://github.com/adamw7/alang/releases/latest/download/alang-PLATFORM.tar.gz
        # is always the latest one (install.sh downloads it).
        run: |
          name="alang-${{ matrix.platform }}"
          dir="$RUNNER_TEMP/archive/$name"
          mkdir -p "$dir/bin" "$dir/docs" "$dir/examples" "$dir/grammar"
          cp "target/native/alang$EXE" "$dir/bin/"
          cp AGENTS.md README.md LICENSE THIRD-PARTY-NOTICES "$dir/"
          cp docs/*.md "$dir/docs/"
          cp examples/*.al examples/*.in examples/README.md "$dir/examples/"
          cp grammar/ALang.g4 "$dir/grammar/"
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            (cd "$RUNNER_TEMP/archive" && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          else
            tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP/archive" "$name"
          fi
          ls -l dist

      - name: Install script
        # install.sh from a copy of what the release will hold: it picks this binary, checks it against
        # SHA256SUMS and links it; with ALANG_JAR=1 it installs the jar's archive instead.
        if: runner.os != 'Windows'
        run: |
          release="$RUNNER_TEMP/release"
          mkdir -p "$release/latest/download"
          cp dist/* target/alang-*.tar.gz "$release/latest/download/"
          (cd "$release/latest/download" && shasum -a 256 -- * > SHA256SUMS)
          home="$RUNNER_TEMP/home"
          HOME="$home" ALANG_DOWNLOAD_URL="file://$release" sh install.sh
          cmp "target/native/alang" "$home/.alang/bin/alang"
          "$home/.local/bin/alang" run examples/hello.al | diff -u tests/examples/hello.out -
          HOME="$home" ALANG_DOWNLOAD_URL="file://$release" ALANG_JAR=1 sh install.sh
          test -f "$home/.alang/lib/alang.jar"
          "$home/.local/bin/alang" run examples/hello.al | diff -u tests/examples/hello.out -

      - uses: actions/upload-artifact@v7
        with:
          name: alang-native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  fuzz:
    name: Fuzz (3000 mutations per program)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Fuzz the checker and interpreter
        timeout-minutes: 5
        run: mvn -B -ntp test -Dtest=FuzzTest -Dalang.fuzz=3000


  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build the toolchain the extension runs
        working-directory: .
        run: mvn -B -ntp -q -DskipTests package

      - name: Test the grammar and the extension
        run: |
          npm ci
          npm test

      - name: Package
        run: npm run package
