name: Mutation testing

on:
  # Too slow for every push: run once a week, on Saturday at 03:17 UTC, against main.
  schedule:
    - cron: '17 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    # A run takes about 6 minutes on the 2-CPU runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mutate the toolchain and run the tests against every mutant
        # Fails when the mutation score or test strength drops below its threshold in pom.xml.
        # One test JVM per CPU: more only adds contention (private repositories get 2 CPUs).
        timeout-minutes: 12
        run: mvn -B -ntp test-compile pitest:mutationCoverage -Dpitest.threads="$(nproc)"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: ignore
