# GraalVM native-image reads this from the jar: `native-image -jar target/alang.jar` builds a binary of the
# toolchain that needs no Java (the release's alang-OS-ARCH archives; see .github/workflows/ci.yml).
# Without --no-fallback a build that cannot compile everything would quietly produce a binary that needs a JVM.
# --install-exit-handlers runs shutdown hooks on SIGTERM and SIGINT, as the JVM does: without it a native
# `serve --http` would die at once instead of finishing the calls under way.
Args = --no-fallback --install-exit-handlers
