# Time limits that keep CI fast. A test that hangs fails on time and names itself, instead of
# stalling the build until the CI job is cancelled. TimeoutTest checks these settings.
#
# Every @Test, @TestFactory and lifecycle method fails after this long. The limit does not reach
# the dynamic tests a @TestFactory returns, so those are built with Harness.dynamicTest, which
# applies Harness.TEST_TIMEOUT (keep the two equal). Surefire also fails the build when the whole
# run takes longer than surefire.timeout seconds (pom.xml).
junit.jupiter.execution.timeout.default = 10 s

# Applied always, including under a debugger, so the limit cannot be switched off by accident.
junit.jupiter.execution.timeout.mode = enabled

# Run each test method on its own thread and abandon it when time is up. The default, SAME_THREAD,
# only interrupts the test, and code that never checks for interrupts (a checker stuck in a loop)
# would run on forever.
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
